[project]
name = "agents-manager-backend"
version = "0.1.0"
description = "Local-only DeepSeek, LangGraph and Claude Agent SDK orchestrator"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.0,<0.3.0",
  "flask>=3.1.0,<4.0.0",
  "flask-cors>=5.0.0,<7.0.0",
  "httpx>=0.27.0,<1.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "openai>=1.60.0,<3.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<10.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["instance*", "tests*"]
