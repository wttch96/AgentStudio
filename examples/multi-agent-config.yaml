# ── 多 Agent 协同配置示例 ──
# 展示完整的 6 Agent 团队配置，使用增强字段

agents:
  - id: master-brain
    name: master-brain
    display_name: 主脑
    role: orchestrator
    description: 负责理解目标、规划、调度、验收和汇总
    agent_type: brain
    capabilities:
      - task_planning
      - task_decomposition
      - agent_selection
      - result_review
      - conflict_resolution
    limitations:
      - 不直接执行大规模代码修改
      - 不直接执行高风险文件操作
    skills: []
    tools: []
    preferred_tasks:
      - planning
      - coordination
      - review
    forbidden_tasks:
      - recursive_file_deletion
    priority: 10
    max_iterations: 10

  - id: frontend-agent
    name: frontend-agent
    display_name: 前端代码 Agent
    role: implementation_agent
    description: 负责 Vue 3 前端页面、组件和接口接入
    agent_type: claude
    sub_dir: frontend
    capabilities:
      - frontend_development
      - component_design
      - api_integration
      - frontend_testing
    limitations:
      - 不负责后端数据库设计
      - 不自行改变公共 API
    skills: []
    tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash
    preferred_tasks:
      - frontend
      - ui
      - api_integration
    forbidden_tasks:
      - database_migration
    priority: 5
    max_iterations: 6

  - id: backend-agent
    name: backend-agent
    display_name: 后端代码 Agent
    role: implementation_agent
    description: 负责 Flask 后端接口、服务和数据库代码
    agent_type: claude
    sub_dir: backend
    capabilities:
      - backend_development
      - api_design
      - database_design
      - backend_testing
    limitations:
      - 不负责前端视觉设计
      - 不自行改变已冻结 API
    skills: []
    tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - Bash
    preferred_tasks:
      - backend
      - api
      - database
    forbidden_tasks:
      - frontend_visual_design
    priority: 5
    max_iterations: 6

  - id: rag-agent
    name: rag-agent
    display_name: RAG 知识检索 Agent
    role: knowledge_agent
    description: 知识库检索与录入，语义和关键词混合搜索
    agent_type: rag
    capabilities:
      - knowledge_retrieval
      - semantic_search
      - keyword_search
      - source_annotation
    limitations:
      - 不修改代码
      - 不修改文件
    tools: []
    preferred_tasks:
      - search
      - retrieve
      - knowledge
    forbidden_tasks:
      - 代码修改
      - 文件修改
    priority: 3
    max_iterations: 3

  - id: file-ops-agent
    name: file-ops-agent
    display_name: 文件操作 Agent
    role: utility_agent
    description: 文件系统操作，包括复制、移动、删除、搜索
    agent_type: file-ops
    capabilities:
      - file_reading
      - file_writing
      - file_copy_move
      - directory_analysis
      - file_diff
    limitations:
      - 不执行代码逻辑
      - 不进行架构决策
      - 禁止无授权递归删除
    tools: []
    preferred_tasks:
      - file
      - copy
      - move
      - list
      - read
    forbidden_tasks:
      - recursive_delete
      - 修改代码逻辑
    priority: 4
    max_iterations: 3

  - id: document-agent
    name: document-agent
    display_name: 文档处理 Agent
    role: utility_agent
    description: 文档整理、对比、总结、信息提取和格式转换
    agent_type: claude
    capabilities:
      - document_organization
      - text_summarization
      - information_extraction
      - format_conversion
    limitations:
      - 不修改代码
      - 不调度其他 Agent
      - 不编造引用
    tools:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
    preferred_tasks:
      - document
      - summary
      - diff
      - compare
    forbidden_tasks:
      - 代码修改
      - 系统架构决策
    priority: 2
    max_iterations: 3

# ── 使用说明 ──
# 1. 每个 Agent 同时支持旧字段（name, display_name, tools, skills）和新字段（capabilities 等）
# 2. capabilities 用于任务分发时的能力匹配
# 3. limitations 在任务调度时自动检查，命中的 Agent 不会被分配
# 4. forbidden_tasks 优先级最高，命中的 Agent 直接排除
# 5. priority 影响同等工作负载下的候选排序
# 6. max_iterations 限制单个任务的最大执行/返工次数
# 7. 所有增强字段对旧配置透明——不存在时使用合理默认值
