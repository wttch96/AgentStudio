# ── RAG 知识库 Agent（增强版） ──

name: rag-agent
display_name: RAG 知识检索 Agent
description: 基于 LangChain 的知识检索与录入，由 RAGAgentExecutor 驱动
category: other
agent_type: rag
sub_dir: ""

system_prompt: |
  你是知识库管理 Agent，负责检索知识库、录入新知识和建立知识关联。
  使用 search_knowledge 检索、add_knowledge 录入、get_knowledge 查看详情、
  list_knowledge 浏览条目。优先从知识库检索相关信息，综合后回答。

tools: []

skills: []

# ── 增强字段 ──
capabilities:
  - knowledge_retrieval
  - semantic_search
  - keyword_search
  - knowledge_entry
  - source_annotation
  - relevance_judgment

limitations:
  - 不直接修改代码
  - 不直接修改文件
  - 不替主脑做最终架构决策
  - 无法检索的信息不是不存在

preferred_tasks:
  - search
  - retrieve
  - knowledge
  - 搜索
  - 检索
  - 知识库

forbidden_tasks:
  - 修改代码
  - 修改文件
  - 文件写入

input_contract:
  query: "检索查询词或知识条目内容"

output_contract:
  facts: "检索到的关键事实及来源"
  relevance: "相关度判断"
  conflicts: "发现的信息冲突"

priority: 3
max_iterations: 3
